<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𓂀 Welcome | Egyptian Museum</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="bg-egypt">

  <section class="hero-landing">
    <div class="hero-video-wrap" id="hero-video-wrap">
      <video class="hero-video" autoplay muted loop playsinline poster="assets/video/hero-poster.jpg">
        <source src="assets/video/hero-bg.mp4" type="video/mp4">
      </video>
      <div class="hero-video-overlay"></div>
    </div>
    <div class="hero-pattern"></div>
    <div class="hero-content px-3">
      <div class="animate-float" style="font-size:6rem;margin-bottom:1rem">𓂀</div>
      <h1 class="animate-shimmer" style="font-size:clamp(2.5rem,6vw,5rem);font-weight:700;letter-spacing:0.15em">
        EGYPTIAN MUSEUM
      </h1>
      <div class="hero-line"></div>
      <p class="sans" style="color:var(--egypt-text-muted);letter-spacing:0.3em;text-transform:uppercase;font-size:clamp(0.9rem,2vw,1.2rem);margin-bottom:2.5rem">
        Cairo · Est. 1902 · Home of Antiquity
      </p>
      <a href="home.html" class="btn-egypt-outline" >Enter the Museum</a>
    </div>
    <div style="position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);animation:bounce 2s infinite;color:var(--egypt-gold);font-size:1.5rem">⌄</div>
  </section>

  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/base.js"></script>
</body>
</html>
